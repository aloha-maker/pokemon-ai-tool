<!doctype html>
<html lang="ja" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ポケモン対戦補助AIツール</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid vh-100 p-4 d-flex flex-column">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="neon-text-purple mb-0">ポケモン対戦補助AIツール</h1>
            <div>
                <button class="btn btn-outline-light neon-border me-2" data-bs-toggle="modal" data-bs-target="#party-generator-modal">
                    <i class="bi bi-magic"></i> パーティ自動生成
                </button>
                <button class="btn btn-outline-light neon-border me-2" data-bs-toggle="modal" data-bs-target="#dashboard-modal">
                    <i class="bi bi-graph-up"></i> 分析ダッシュボード
                </button>
            </div>
        </header>

        <main class="row flex-grow-1 gx-4">
            <!-- 左カラム: パーティ情報と選出予測 -->
            <section class="col-md-5 d-flex flex-column">
                <div class="glass-card flex-grow-1 p-3 d-flex flex-column">
                    <h2 class="neon-text-blue mb-3"><i class="bi bi-diagram-3"></i> 選出予測</h2>

                    <!-- パーティ入力フォーム -->
                    <div class="row">
                        <!-- 自パーティ入力 -->
                        <div class="col-6">
                            <h5><i class="bi bi-person-fill"></i> 自パーティ</h5>
                            <form id="my-party-form">
                                <!-- 6体分の入力フィールド -->
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン1" value="ドラパルト">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン2" value="サーフゴー">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン3" value="キョジオーン">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン4" value="ヘイラッシャ">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン5" value="カイリュー">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン6" value="ハッサム">
                            </form>
                        </div>
                        <!-- 相手パーティ入力 -->
                        <div class="col-6">
                            <h5><i class="bi bi-person-bounding-box"></i> 相手パーティ</h5>
                            <form id="opponent-party-form">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン1" value="マスカーニャ">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン2" value="ラウドボーン">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン3" value="ウェーニバル">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン4" value="ドドゲザン">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン5" value="キノガッサ">
                                <input type="text" class="form-control form-control-sm mb-2" placeholder="ポケモン6" value="ミミッキュ">
                            </form>
                        </div>
                    </div>

                    <div class="d-grid my-3">
                        <button id="predict-button" class="btn btn-primary neon-border">
                            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            予測を開始
                        </button>
                    </div>

                    <!-- 予測結果表示エリア -->
                    <div id="prediction-result-area" class="mt-3 flex-grow-1" style="min-height: 200px;">
                         <!-- JavaScriptによって結果がここに描画される -->
                         <div class="text-center text-muted pt-5">
                            <p>パーティを入力して「予測を開始」を押してください</p>
                         </div>
                    </div>
                </div>
            </section>

            <!-- 右カラム: リアルタイム対戦補助 -->
            <section class="col-md-7 d-flex flex-column">
                 <!-- ここに対戦画面プレビューと行動提案コンポーネントを配置 -->
                 <div class="glass-card flex-grow-1 p-3">
                    <h2 class="neon-text-blue mb-3">リアルタイム解析</h2>
                                     <div class="glass-card p-3 mt-4 neon-border">
                    <h4 class="neon-text-blue"><i class="bi bi-lightbulb-fill"></i> AIの推奨アクション</h4>
                    <div class="text-center my-3">
                        <p class="lead mb-1">技選択</p>
                        <h2 class="display-6 fw-bold">10まんボルト</h2>
                    </div>
                    <p class="text-muted small">
                        <span class="fw-bold">理由:</span> 相手の「ギャラドス」に対して効果抜群(x4)です。
                    </p>
                </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 分析ダッシュボードモーダル -->
    <div class="modal fade" id="dashboard-modal" tabindex="-1" aria-labelledby="dashboardLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header border-0">
                    <h5 class="modal-title neon-text-blue" id="dashboardLabel"><i class="bi bi-graph-up"></i> 分析ダッシュボード</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <!-- 左: 統計サマリーとグラフ -->
                        <div class="col-md-5">
                            <h4 class="neon-text-purple">戦績サマリー</h4>
                            <div class="row text-center mb-4">
                                <div class="col-4">
                                    <div class="glass-card p-2">
                                        <div class="fs-4 fw-bold" id="total-matches">--</div>
                                        <div class="small text-muted">総対戦数</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="glass-card p-2">
                                        <div class="fs-4 fw-bold" id="total-wins">--</div>
                                        <div class="small text-muted">勝利数</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="glass-card p-2">
                                        <div class="fs-4 fw-bold" id="win-rate">--%</div>
                                        <div class="small text-muted">勝率</div>
                                    </div>
                                </div>
                            </div>
                            <canvas id="winRateChart"></canvas>
                        </div>
                        <!-- 右: 対戦履歴テーブル -->
                        <div class="col-md-7">
                             <h4 class="neon-text-purple">最近の対戦履歴</h4>
                             <div class="table-responsive" style="max-height: 400px;">
                                <table class="table table-sm table-borderless">
                                    <thead>
                                        <tr>
                                            <th>日時</th>
                                            <th>結果</th>
                                            <th>自選出</th>
                                            <th>相手パーティ</th>
                                        </tr>
                                    </thead>
                                    <tbody id="history-table-body">
                                        <!-- JSでデータが挿入される -->
                                    </tbody>
                                </table>
                             </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- パーティ自動生成モーダル -->
    <div class="modal fade" id="party-generator-modal" tabindex="-1" aria-labelledby="partyGeneratorLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header border-0">
                    <h5 class="modal-title neon-text-blue" id="partyGeneratorLabel"><i class="bi bi-magic"></i> パーティ自動生成</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <!-- 左: 入力フォーム -->
                        <div class="col-md-5">
                            <h4 class="neon-text-purple">条件入力</h4>
                            <form id="party-generator-form">
                                <div class="mb-3">
                                    <label for="available-pokemon" class="form-label">使用可能なポケモン</label>
                                    <textarea class="form-control" id="available-pokemon" rows="6" placeholder="ピカチュウ\nリザードン\nフシギバナ\nカメックス\n...">ピカチュウ
リザードン
フシギバナ
カメックス
ゲンガー
ラプラス
カビゴン
サンダース</textarea>
                                    <div class="form-text">1行に1匹ずつ入力してください。</div>
                                </div>
                                <div class="mb-3">
                                    <label for="tactical-concept" class="form-label">戦術コンセプト</label>
                                    <input type="text" class="form-control" id="tactical-concept" placeholder="例: 対面構築、サイクル戦重視" value="対面構築">
                                </div>
                                <div class="d-grid">
                                    <button type="button" id="generate-party-button" class="btn btn-primary neon-border">
                                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                        生成を開始
                                    </button>
                                </div>
                            </form>
                        </div>
                        <!-- 右: 生成結果 -->
                        <div class="col-md-7">
                            <h4 class="neon-text-purple">生成結果</h4>
                            <div id="party-generation-result-area" class="p-3" style="min-height: 300px;">
                                <div class="text-center text-muted pt-5">
                                    <p>条件を入力して「生成を開始」を押してください</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</body>
</html>
