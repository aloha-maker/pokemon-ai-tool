<!-- F-08: 対戦シミュレーションモーダル -->
<div class="modal fade" id="simulator-modal" tabindex="-1" aria-labelledby="simulatorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content glass-card">
            <div class="modal-header border-0">
                <h5 class="modal-title neon-text-blue" id="simulatorModalLabel"><i class="bi bi-joystick"></i> 疑似対戦シミュレーション</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- 左カラム: 設定 -->
                    <div class="col-md-4">
                        <h5 class="neon-text-purple">対戦設定</h5>
                        <div class="mb-3">
                            <label for="sim-party1-id" class="form-label">自分のパーティ</label>
                            <select class="form-select sim-party-selector" id="sim-party1-id"></select>
                        </div>
                        <div class="mb-3">
                            <label for="sim-party2-id" class="form-label">相手のパーティ</label>
                            <select class="form-select sim-party-selector" id="sim-party2-id"></select>
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-primary neon-border" id="start-simulation-btn">
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                シミュレーション開始
                            </button>
                        </div>
                    </div>
                    <!-- 右カラム: 結果ログ -->
                    <div class="col-md-8">
                        <h5 class="neon-text-purple">シミュレーションログ</h5>
                        <div id="simulation-log-area" class="bg-dark text-light p-3 rounded" style="height: 60vh; overflow-y: auto; font-family: monospace; font-size: 0.8rem;">
                            <p class="text-muted">パーティを選択して「シミュレーション開始」を押してください。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
