{% extends "base.html" %}

{% block title %}データベース管理{% endblock %}

{% block content %}
<main class="container mt-4">
    <h1 class="neon-text-purple mb-4">データベース管理</h1>
    
    <!-- 検索フォーム -->
    <div class="glass-card p-3 mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-3">
                <label for="table-select" class="form-label">テーブル</label>
                <select id="table-select" class="form-select"></select>
            </div>
            <div class="col-md-7">
                <label for="search-keyword" class="form-label">検索キーワード</label>
                <input type="text" id="search-keyword" class="form-control" placeholder="すべての列を対象に検索...">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button id="search-button" class="btn btn-primary neon-border w-100">
                    <i class="bi bi-search"></i> 検索
                </button>
            </div>
        </div>
    </div>

    <!-- 結果表示エリア -->
    <div id="result-container" class="glass-card p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span id="result-count"></span>
            <nav id="pagination-container"></nav>
        </div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead id="result-table-head">
                </thead>
                <tbody id="result-table-body">
                </tbody>
            </table>
        </div>
    </div>
</main>
{% endblock %}
