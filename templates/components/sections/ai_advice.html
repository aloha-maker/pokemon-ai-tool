<!-- 右カラム: AIアドバイス -->
<section class="col-lg-6 d-flex flex-column">
    <div class="glass-card flex-grow-1 p-1 d-flex flex-column">
        <ul class="nav nav-tabs nav-fill" id="ai-advice-tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="selection-advice-tab" data-bs-toggle="tab"
                    data-bs-target="#selection-advice-pane" type="button" role="tab"
                    aria-controls="selection-advice-pane" aria-selected="true">選出アドバイス</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="battle-advice-tab" data-bs-toggle="tab"
                    data-bs-target="#battle-advice-pane" type="button" role="tab"
                    aria-controls="battle-advice-pane" aria-selected="false">バトル中アドバイス</button>
            </li>
        </ul>
        <div class="tab-content flex-grow-1 p-3" id="ai-advice-tabs-content">
            <div class="tab-pane fade show active h-100" id="selection-advice-pane" role="tabpanel"
                aria-labelledby="selection-advice-tab">
                <!-- 予測結果表示エリア -->
                <div id="prediction-result-area" class="h-100">
                    <div class="text-center text-muted pt-5 h-100">
                        <p>パーティを入力して「予測を開始」を押してください</p>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade h-100" id="battle-advice-pane" role="tabpanel"
                aria-labelledby="battle-advice-tab">
                <div class="d-flex flex-column h-100">
                    <!-- 上半分: AIの行動提案 -->
                    <div id="suggestion-overlay" class="h-50" style="overflow-y: auto;">
                        <div class="text-center text-muted pt-5 h-100">
                            <p>「解析を開始」すると、ここにAIの推奨アクションが表示されます。</p>
                        </div>
                    </div>

                    <!-- 下半分: ログ & デバッグ -->
                    <div class="h-50 d-flex flex-column">
                        <!-- リアルタイムバトルログ -->
                        <div class="glass-card-inside p-2 mt-2 flex-grow-1"
                            style="display: flex; flex-direction: column; min-height: 0;">
                            <h6 class="neon-text-purple mb-2 flex-shrink-0">リアルタイムバトルログ</h6>
                            <div id="realtime-log-output" class="font-monospace small flex-grow-1"
                                style="overflow-y: auto;">
                                <!-- ログがここに表示される -->
                            </div>
                        </div>


                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
