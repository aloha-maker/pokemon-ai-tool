<!-- F-05: 育成済みポケモン管理モーダル -->
<div class="modal fade" id="trained-pokemon-modal" tabindex="-1" aria-labelledby="trainedPokemonModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content glass-card">
            <div class="modal-header border-0">
                <h5 class="modal-title neon-text-blue" id="trainedPokemonModalLabel"><i class="bi bi-archive"></i> 育成済みポケモン管理</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="trained-pokemon-alert" class="alert" style="display: none;"></div>
                <div class="d-flex justify-content-end mb-3">
                    <button id="show-add-pokemon-modal" class="btn btn-primary neon-border">
                        <i class="bi bi-plus-circle"></i> 新規登録
                    </button>
                </div>

                <div class="table-responsive" style="max-height: 60vh;">
                    <table class="table table-sm table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>ポケモン</th>
                                <th>ニックネーム</th>
                                <th>レベル</th>
                                <th>テラスタイプ</th>
                                <th>持ち物</th>
                                <th>特性</th>
                                <th>性格</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="trained-pokemon-list-tbody">
                            <!-- JSで一覧をここに描画 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
