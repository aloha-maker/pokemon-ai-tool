<!-- F-06: パーティ管理モーダル -->
<div class="modal fade" id="party-management-modal" tabindex="-1" aria-labelledby="partyManagementModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content glass-card">
            <div class="modal-header border-0">
                <h5 class="modal-title neon-text-blue" id="partyManagementModalLabel"><i class="bi bi-collection"></i> パーティ管理</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- 左カラム: 登録・編集フォーム -->
                    <div class="col-lg-5">
                        <div class="glass-card-inside p-3">
                            <h4 id="party-form-title" class="neon-text-purple mb-3">新規パーティ登録</h4>
                            <form id="party-form">
                                <input type="hidden" id="party-id">
                                <div class="mb-3">
                                    <label for="party-name" class="form-label">パーティ名</label>
                                    <input type="text" class="form-control" id="party-name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="party-description" class="form-label">説明（任意）</label>
                                    <textarea class="form-control" id="party-description" rows="2"></textarea>
                                </div>
                                <h6>メンバー選択</h6>
                                <div class="row g-2">
                                    <!-- 育成済みポケモン選択用のドロップダウンを6つ生成 -->
                                    {% for i in range(6) %}
                                    <div class="col-6 mb-2">
                                        <select class="form-select form-select-sm member-select" id="member-{{ i }}">
                                            <option value="">メンバー {{ i + 1 }}</option>
                                            <!-- 育成済みポケモンがJSによって動的に追加される -->
                                        </select>
                                    </div>
                                    {% endfor %}
                                </div>
                                <div class="d-flex justify-content-end mt-3">
                                    <button type="button" class="btn btn-secondary me-2" id="cancel-edit-btn" style="display: none;">キャンセル</button>
                                    <button type="submit" class="btn btn-primary neon-border">保存</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <!-- 右カラム: 登録済みパーティ一覧 -->
                    <div class="col-lg-7">
                        <h4 class="neon-text-purple mb-3">登録済みパーティ一覧</h4>
                        <div id="party-list" class="row g-3" style="max-height: 60vh; overflow-y: auto;">
                            <!-- パーティカードがJSによって動的に追加される -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
