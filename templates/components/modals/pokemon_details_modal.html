<!-- Pokemon Details Modal -->
<div class="modal fade" id="pokemon-details-modal" tabindex="-1" aria-labelledby="pokemonDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content glass-card">
            <div class="modal-header border-0">
                <h5 class="modal-title neon-text-blue" id="pokemonDetailsModalLabel">ポケモン詳細</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="details-pokemon-slot-id">
                <h4 id="details-pokemon-name" class="text-center mb-4"></h4>

                <!-- Ability -->
                <div class="mb-4">
                    <label for="details-ability-input" class="form-label">特性</label>
                    <input type="text" id="details-ability-input" class="form-control" list="ability-datalist" placeholder="特性を入力...">
                </div>

                <!-- Terastal Type -->
                <div class="mb-4">
                    <label for="details-tera-type-select" class="form-label">テラスタイプ</label>
                    <select class="form-select" id="details-tera-type-select"></select>
                </div>

                <!-- Item -->
                <div class="mb-4">
                    <label for="details-item-input" class="form-label">持ち物</label>
                    <input type="text" id="details-item-input" class="form-control" list="item-datalist" placeholder="持ち物を入力...">
                </div>

                <!-- Moves -->
                <h5 class="mb-3">技構成</h5>
                <div id="details-moves-container">
                    <!-- Move 1 -->
                    <div class="row g-2 align-items-center mb-3">
                        <div class="col-8">
                            <input type="text" class="form-control details-move-input" id="details-move-input-1" list="move-datalist" placeholder="技1を入力...">
                        </div>
                        <div class="col-4">
                            <div class="input-group">
                                <button class="btn btn-outline-secondary pp-btn" type="button" data-action="decrement">-</button>
                                <input type="text" class="form-control pp-input text-center" value="8" readonly>
                                <button class="btn btn-outline-secondary pp-btn" type="button" data-action="increment">+</button>
                            </div>
                        </div>
                    </div>
                    <!-- Move 2 -->
                    <div class="row g-2 align-items-center mb-3">
                        <div class="col-8">
                            <input type="text" class="form-control details-move-input" id="details-move-input-2" list="move-datalist" placeholder="技2を入力...">
                        </div>
                        <div class="col-4">
                            <div class="input-group">
                                <button class="btn btn-outline-secondary pp-btn" type="button" data-action="decrement">-</button>
                                <input type="text" class="form-control pp-input text-center" value="8" readonly>
                                <button class="btn btn-outline-secondary pp-btn" type="button" data-action="increment">+</button>
                            </div>
                        </div>
                    </div>
                    <!-- Move 3 -->
                    <div class="row g-2 align-items-center mb-3">
                        <div class="col-8">
                            <input type="text" class="form-control details-move-input" id="details-move-input-3" list="move-datalist" placeholder="技3を入力...">
                        </div>
                        <div class="col-4">
                            <div class="input-group">
                                <button class="btn btn-outline-secondary pp-btn" type="button" data-action="decrement">-</button>
                                <input type="text" class="form-control pp-input text-center" value="8" readonly>
                                <button class="btn btn-outline-secondary pp-btn" type="button" data-action="increment">+</button>
                            </div>
                        </div>
                    </div>
                    <!-- Move 4 -->
                    <div class="row g-2 align-items-center mb-3">
                        <div class="col-8">
                            <input type="text" class="form-control details-move-input" id="details-move-input-4" list="move-datalist" placeholder="技4を入力...">
                        </div>
                        <div class="col-4">
                            <div class="input-group">
                                <button class="btn btn-outline-secondary pp-btn" type="button" data-action="decrement">-</button>
                                <input type="text" class="form-control pp-input text-center" value="8" readonly>
                                <button class="btn btn-outline-secondary pp-btn" type="button" data-action="increment">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                <button type="button" class="btn btn-primary neon-border" id="save-pokemon-details-btn">保存</button>
            </div>
        </div>
    </div>
</div>
