<!-- 持ち物編集モーダル -->
<div class="modal fade" id="item-editor-modal" tabindex="-1" aria-labelledby="itemEditorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content glass-card">
            <div class="modal-header border-0">
                <h5 class="modal-title neon-text-blue" id="itemEditorModalLabel"><i class="bi bi-gem"></i> 持ち物編集</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="item-editor-alert" class="alert" style="display: none;"></div>
                <div class="row">
                    <!-- 左側: 持ち物一覧 -->
                    <div class="col-md-7">
                        <h4 class="neon-text-purple mb-3">登録済み持ち物一覧</h4>
                        <div class="list-group" id="item-list" style="max-height: 50vh; overflow-y: auto;">
                            <!-- アイテムがここに動的に読み込まれる -->
                        </div>
                    </div>
                    <!-- 右側: 新規登録・編集フォーム -->
                    <div class="col-md-5">
                        <div class="glass-card-inside p-3">
                            <h4 id="item-form-title" class="neon-text-purple mb-3">新規持ち物登録</h4>
                            <form id="item-form">
                                <input type="hidden" id="item-id">
                                <div class="mb-3">
                                    <label for="item-name" class="form-label">持ち物名</label>
                                    <input type="text" class="form-control" id="item-name" required>
                                </div>
                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-secondary me-2" id="cancel-item-edit-btn"
                                        style="display: none;">キャンセル</button>
                                    <button type="submit" class="btn btn-primary neon-border">保存</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
