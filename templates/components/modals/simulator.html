<!-- F-08: 対戦シミュレーションモーダル -->
<div class="modal fade" id="simulator-modal" tabindex="-1" aria-labelledby="simulatorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content glass-card">
            <div class="modal-header border-0">
                <h5 class="modal-title neon-text-blue" id="simulatorModalLabel"><i class="bi bi-joystick"></i> 疑似対戦シミュレーション</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- 初期設定画面 -->
                <div id="simulation-setup-screen">
                    <div class="row justify-content-center">
                        <div class="col-md-8">
                            <h5 class="neon-text-purple text-center">対戦設定</h5>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label for="sim-party1-id" class="form-label">自分のパーティ</label>
                                    <select class="form-select sim-party-selector" id="sim-party1-id"></select>
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="sim-party2-id" class="form-label">相手のパーティ</label>
                                    <select class="form-select sim-party-selector" id="sim-party2-id"></select>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button class="btn btn-primary neon-border" id="start-simulation-btn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                    対戦準備
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 選出画面 (JSで生成、最初は非表示) -->
                <div id="simulation-selection-screen" class="d-none">
                    <h5 class="neon-text-purple text-center">ポケモン選出 (各3体選択)</h5>
                    <div class="row">
                        <div class="col-6" id="party1-selection-area">
                            <h6 class="text-center" id="party1-name-display"></h6>
                            <div id="party1-selection-list" class="list-group"></div>
                        </div>
                        <div class="col-6" id="party2-selection-area">
                            <h6 class="text-center" id="party2-name-display"></h6>
                            <div id="party2-selection-list" class="list-group"></div>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <button class="btn btn-success neon-border" id="confirm-selection-btn2">
                            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            選出完了
                        </button>
                    </div>
                </div>

                <!-- 対戦画面 (JSで生成、最初は非表示) -->
                <div id="simulation-battle-screen" class="d-none">
                    <div class="row">
                        <!-- 左カラム: 対戦フィールド -->
                        <div class="col-md-8">
                            <h5 class="neon-text-purple">バトルフィールド</h5>
                            <div id="battle-field" class="p-3 glass-card-inside rounded">
                                <!-- 相手フィールド -->
                                <div id="opponent-field" class="mb-5 text-end">
                                    <div id="opponent-pokemon-info">
                                        <span id="opponent-pokemon-name" class="fs-5 fw-bold"></span>
                                        <div class="progress" style="height: 10px;">
                                            <div id="opponent-pokemon-hp-bar" class="progress-bar bg-success" role="progressbar" style="width: 100%;"></div>
                                        </div>
                                        <small id="opponent-pokemon-hp-text" class="text-muted"></small>
                                    </div>
                                </div>
                                <!-- 自分フィールド -->
                                <div id="player-field" class="mt-5">
                                     <div id="player-pokemon-info">
                                        <span id="player-pokemon-name" class="fs-5 fw-bold"></span>
                                        <div class="progress" style="height: 10px;">
                                            <div id="player-pokemon-hp-bar" class="progress-bar bg-success" role="progressbar" style="width: 100%;"></div>
                                        </div>
                                        <small id="player-pokemon-hp-text" class="text-muted"></small>
                                    </div>
                                </div>
                            </div>
                             <div class="text-center mt-3">
                                <button class="btn btn-warning neon-border" id="next-turn-btn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                    ターンを進める
                                </button>
                            </div>
                        </div>
                        <!-- 右カラム: ログ -->
                        <div class="col-md-4">
                            <h5 class="neon-text-purple">シミュレーションログ</h5>
                            <div id="simulation-log-area" class="bg-dark text-light p-3 rounded" style="height: 60vh; overflow-y: auto; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap;">
                                <p class="text-muted">対戦準備ボタンを押して開始してください。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
