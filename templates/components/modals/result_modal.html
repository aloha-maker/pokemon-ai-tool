<!-- Result Selection Modal -->
<div class="modal fade" id="result-modal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content glass-card">
            <div class="modal-header border-0">
                <h5 class="modal-title neon-text-blue" id="resultModalLabel">対戦結果の保存</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <p>この対戦の結果を選択してください。</p>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-lg btn-success neon-border" data-result="win">
                        <i class="bi bi-trophy-fill"></i> 勝利 (Win)
                    </button>
                    <button type="button" class="btn btn-lg btn-danger neon-border" data-result="lose">
                        <i class="bi bi-emoji-frown-fill"></i> 敗北 (Lose)
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
