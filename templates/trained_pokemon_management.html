
{% extends "index.html" %}

{% block title %}育成済みポケモン管理{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>育成済みポケモン管理</h2>
        <button id="show-add-pokemon-modal" class="btn btn-primary">新規登録</button>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ポケモン名</th>
                    <th>ニックネーム</th>
                    <th>レベル</th>
                    <th>テラスタイプ</th>
                    <th>持ち物</th>
                    <th>特性</th>
                    <th>性格</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="trained-pokemon-list">
                <!-- JavaScriptで一覧をここに描画 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 新規登録・編集用モーダル -->
<div class="modal fade" id="pokemon-form-modal" tabindex="-1" aria-labelledby="pokemonFormModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="pokemonFormModalLabel">ポケモン情報</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="pokemon-form">
                    <input type="hidden" id="pokemon-id">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="pokemon-master-id" class="form-label">ポケモン</label>
                            <select class="form-select" id="pokemon-master-id" required></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="nickname" class="form-label">ニックネーム</label>
                            <input type="text" class="form-control" id="nickname">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="level" class="form-label">レベル</label>
                            <input type="number" class="form-control" id="level" value="50" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="tera-type-id" class="form-label">テラスタイプ</label>
                            <select class="form-select" id="tera-type-id"></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="held-item-id" class="form-label">持ち物</label>
                            <select class="form-select" id="held-item-id"></select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="ability-id" class="form-label">特性</label>
                            <select class="form-select" id="ability-id"></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="nature-id" class="form-label">性格</label>
                            <select class="form-select" id="nature-id"></select>
                        </div>
                    </div>

                    <hr>
                    <h6>技構成</h6>
                    <div class="row">
                        <div class="col-md-6 mb-3"><select class="form-select move-select" id="move1-id"></select></div>
                        <div class="col-md-6 mb-3"><select class="form-select move-select" id="move2-id"></select></div>
                        <div class="col-md-6 mb-3"><select class="form-select move-select" id="move3-id"></select></div>
                        <div class="col-md-6 mb-3"><select class="form-select move-select" id="move4-id"></select></div>
                    </div>

                    <hr>
                    <h6>努力値 (EV)</h6>
                    <div class="row">
                        <div class="col-sm-4 col-md-2 mb-3"><label for="ev-hp">HP</label><input type="number" class="form-control ev-input" id="ev-hp" value="0"></div>
                        <div class="col-sm-4 col-md-2 mb-3"><label for="ev-atk">攻撃</label><input type="number" class="form-control ev-input" id="ev-atk" value="0"></div>
                        <div class="col-sm-4 col-md-2 mb-3"><label for="ev-def">防御</label><input type="number" class="form-control ev-input" id="ev-def" value="0"></div>
                        <div class="col-sm-4 col-md-2 mb-3"><label for="ev-spa">特攻</label><input type="number" class="form-control ev-input" id="ev-spa" value="0"></div>
                        <div class="col-sm-4 col-md-2 mb-3"><label for="ev-spd">特防</label><input type="number" class="form-control ev-input" id="ev-spd" value="0"></div>
                        <div class="col-sm-4 col-md-2 mb-3"><label for="ev-spe">素早</label><input type="number" class="form-control ev-input" id="ev-spe" value="0"></div>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                <button type="submit" class="btn btn-primary" form="pokemon-form">保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

</script>
{% endblock %}
