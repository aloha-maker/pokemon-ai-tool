<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像・テキスト比較エディタ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .file-input {
            margin-bottom: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .file-input label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            background: #fafafa;
        }
        .panel h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .image-container {
            width: 100%;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 2px dashed #ddd;
            border-radius: 4px;
        }
        .image-container img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }
        textarea {
            width: 100%;
            min-height: 300px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .navigation {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .save-btn {
            background: #28a745;
        }
        .save-btn:hover {
            background: #218838;
        }
        .page-info {
            font-weight: 600;
            color: #333;
        }
        .filename {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
        .no-data {
            color: #999;
            text-align: center;
            padding: 40px;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 4px;
            font-size: 13px;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="margin-bottom: 20px;">画像・テキスト比較エディタ</h1>
        
        <div class="file-input">
            <div>
                <label>フォルダを選択:</label>
                <button id="selectFolderBtn">フォルダを選択</button>
                <div class="info-text">画像ファイル（.jpg）とそれに対応する.gt.txtファイルのペアを自動検出します</div>
                <div class="status" id="status" style="display:none;"></div>
            </div>
        </div>

        <div class="content">
            <div class="panel">
                <h3>画像</h3>
                <div class="filename" id="imageName"></div>
                <div class="image-container" id="imageContainer">
                    <div class="no-data">フォルダを選択してください</div>
                </div>
            </div>
            <div class="panel">
                <h3>テキスト</h3>
                <div class="filename" id="textName"></div>
                <textarea id="textArea" placeholder="対応するテキストファイルが表示されます"></textarea>
            </div>
        </div>

        <div class="controls">
            <div class="navigation">
                <button id="prevBtn" disabled>前へ</button>
                <span class="page-info" id="pageInfo">0 / 0</span>
                <button id="nextBtn" disabled>次へ</button>
            </div>
            <button class="save-btn" id="saveBtn" disabled>保存</button>
        </div>
    </div>

    <script>
        let filePairs = [];
        let currentIndex = 0;
        let directoryHandle = null;

        const selectFolderBtn = document.getElementById('selectFolderBtn');
        const imageContainer = document.getElementById('imageContainer');
        const textArea = document.getElementById('textArea');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const saveBtn = document.getElementById('saveBtn');
        const pageInfo = document.getElementById('pageInfo');
        const imageName = document.getElementById('imageName');
        const textName = document.getElementById('textName');
        const status = document.getElementById('status');

        // File System Access API のサポートチェック
        if (!('showDirectoryPicker' in window)) {
            status.style.display = 'block';
            status.className = 'status error';
            status.textContent = 'このブラウザはFile System Access APIに対応していません。Chrome または Edge の最新版をご使用ください。';
            selectFolderBtn.disabled = true;
        }

        selectFolderBtn.addEventListener('click', async () => {
            try {
                directoryHandle = await window.showDirectoryPicker({
                    mode: 'readwrite'
                });
                await loadFilesFromDirectory();
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('フォルダ選択エラー:', err);
                    showStatus('フォルダの選択に失敗しました', 'error');
                }
            }
        });

        async function loadFilesFromDirectory() {
            filePairs = [];
            const imageFiles = [];
            const textFileHandles = new Map();

            try {
                // フォルダ内のファイルを列挙
                for await (const entry of directoryHandle.values()) {
                    if (entry.kind === 'file') {
                        const name = entry.name.toLowerCase();
                        if (name.endsWith('.jpg') || name.endsWith('.jpeg')) {
                            imageFiles.push(entry);
                        } else if (name.endsWith('.gt.txt')) {
                            const baseName = entry.name.slice(0, -7); // .gt.txt を除く
                            textFileHandles.set(baseName, entry);
                        }
                    }
                }

                // ペアを作成
                for (const imgHandle of imageFiles) {
                    const baseName = imgHandle.name.replace(/\.(jpg|jpeg)$/i, '');
                    const txtHandle = textFileHandles.get(baseName);
                    
                    filePairs.push({
                        imageHandle: imgHandle,
                        textHandle: txtHandle || null,
                        baseName: baseName
                    });
                }

                // ファイル名順にソート
                filePairs.sort((a, b) => a.baseName.localeCompare(b.baseName));

                const withText = filePairs.filter(p => p.textHandle).length;
                showStatus(`検出: ${filePairs.length}個の画像ファイル（${withText}個にgt.txtファイルあり）`, 'success');

                currentIndex = 0;
                await updateDisplay();
            } catch (err) {
                console.error('ファイル読み込みエラー:', err);
                showStatus('ファイルの読み込みに失敗しました', 'error');
            }
        }

        prevBtn.addEventListener('click', async () => {
            if (currentIndex > 0) {
                currentIndex--;
                await updateDisplay();
            }
        });

        nextBtn.addEventListener('click', async () => {
            if (currentIndex < filePairs.length - 1) {
                currentIndex++;
                await updateDisplay();
            }
        });

        saveBtn.addEventListener('click', async () => {
            const pair = filePairs[currentIndex];
            if (!pair) return;

            try {
                const content = textArea.value;
                let fileHandle = pair.textHandle;

                // テキストファイルが存在しない場合は新規作成
                if (!fileHandle) {
                    fileHandle = await directoryHandle.getFileHandle(
                        pair.baseName + '.gt.txt',
                        { create: true }
                    );
                    pair.textHandle = fileHandle;
                }

                // ファイルに書き込み
                const writable = await fileHandle.createWritable();
                await writable.write(content);
                await writable.close();

                showStatus('保存しました', 'success');
                setTimeout(() => {
                    status.style.display = 'none';
                }, 2000);
            } catch (err) {
                console.error('保存エラー:', err);
                showStatus('保存に失敗しました', 'error');
            }
        });

        async function updateDisplay() {
            const maxLength = filePairs.length;
            
            pageInfo.textContent = maxLength > 0 ? `${currentIndex + 1} / ${maxLength}` : '0 / 0';
            
            prevBtn.disabled = currentIndex === 0 || maxLength === 0;
            nextBtn.disabled = currentIndex >= maxLength - 1 || maxLength === 0;
            
            if (maxLength === 0) {
                imageContainer.innerHTML = '<div class="no-data">フォルダを選択してください</div>';
                imageName.textContent = '';
                textArea.value = '';
                textName.textContent = '';
                saveBtn.disabled = true;
                return;
            }

            const pair = filePairs[currentIndex];
            
            try {
                // 画像表示
                if (pair.imageHandle) {
                    const file = await pair.imageHandle.getFile();
                    const url = URL.createObjectURL(file);
                    imageContainer.innerHTML = `<img src="${url}" alt="Image">`;
                    imageName.textContent = `ファイル名: ${pair.imageHandle.name}`;
                }
                
                // テキスト表示
                if (pair.textHandle) {
                    const file = await pair.textHandle.getFile();
                    const text = await file.text();
                    textArea.value = text;
                    textName.textContent = `ファイル名: ${pair.textHandle.name}`;
                } else {
                    textArea.value = '';
                    textName.textContent = `対応する.gt.txtファイルがありません（新規作成可能）`;
                }
                
                saveBtn.disabled = false;
            } catch (err) {
                console.error('表示エラー:', err);
                showStatus('ファイルの読み込みに失敗しました', 'error');
            }
        }

        function showStatus(message, type) {
            status.style.display = 'block';
            status.className = 'status ' + type;
            status.textContent = message;
        }
    </script>
</body>
</html>
